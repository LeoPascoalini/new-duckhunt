<text x="120" y="1806" font-size="27" fill="#333333"><tspan font-weight="bold">Pilhas no pino 5V</tspan>, nunca no 3V3 (o regulador da placa baixa para 3,3 V).</text>
<text x="120" y="1854" font-size="27" fill="#333333"><tspan font-weight="bold">Sensor em pino ADC1</tspan> (GPIO1–10 no S3). O ADC2 conflita com o rádio Bluetooth/Wi-Fi.</text>
<text x="120" y="1902" font-size="27" fill="#333333"><tspan font-weight="bold">Gatilho, Start e Select:</tspan> INPUT_PULLUP (GPIO2, GPIO4, GPIO5), apertado = LOW.</text>
<text x="120" y="1950" font-size="27" fill="#333333"><tspan font-weight="bold">Start e Select:</tspan> botões opcionais; durante um tiro o firmware os ignora.</text>
<text x="1700" y="1806" font-size="27" fill="#333333"><tspan font-weight="bold">USB-C:</tspan> só para gravar. Por segurança, desligue o interruptor antes de conectar.</text>
<text x="1700" y="1854" font-size="27" fill="#333333"><tspan font-weight="bold">Pinos são sugestão:</tspan> confira a serigrafia da sua placa.</text>
<text x="1700" y="1902" font-size="27" fill="#333333"><tspan font-weight="bold">Divisor 100k/100k:</tspan> GPIO3 lê metade da tensão das pilhas.</text>
<text x="1700" y="1950" font-size="27" fill="#333333"><tspan font-weight="bold">Gamepad:</tspan> A = luz, B = gatilho, Start = pato 1 ou botão, Select = pato 2 ou botão.</text>
